<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; img-src 'self' blob: data:">
    <title>AE86 Companion</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: transparent
        }

        canvas {
            display: block
        }

        #choices {
            position: fixed;
            display: flex;
            gap: 14px;
            transform: translateX(-50%);
            z-index: 10;
            animation: pop .22s ease-out
        }

        #choices[hidden] {
            display: none
        }

        #choices button {
            font: 600 16px/1 system-ui, -apple-system, sans-serif;
            color: #fff;
            padding: 12px 26px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 999px;
            background: rgba(20, 24, 32, .82);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform .12s, background .12s
        }

        #choices button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: rgba(40, 110, 255, .92)
        }

        #choices button:disabled {
            opacity: .45;
            cursor: default
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%)
            }
        }

        #reminder-info {
            position: fixed;
            transform: translate(-50%, -100%);
            background: rgba(20, 24, 32, 0.9);
            color: #fff;
            padding: 8px 16px;
            border-radius: 12px;
            font: 600 15px system-ui;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.15);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        #reminder-info small {
            display: block;
            font: 500 12px system-ui;
            color: #a1a5b3;
            margin-top: 2px;
        }

        #reminder-info[hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="scene"></canvas>
    <div id="reminder-info" hidden></div>
    <div id="choices" hidden></div>
    <script src="app.bundle.js"></script>
</body>

</html>
